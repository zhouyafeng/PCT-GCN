[project]
name = "pct-gcn"
version = "0.1.0"
description = "Skeleton-based action recognition with GCN"
requires-python = "==3.14.*"
dependencies = [
    "torch==2.12.0",
    "torchvision==0.27.0",
    "numpy==2.4.6",
    "pyyaml==6.0.3",
    "tqdm==4.68.2",
    "matplotlib==3.11.0",
    "scikit-learn==1.9.0",
    "h5py==3.16.0",
    "calflops==0.3.2",
    "transformers==5.12.0",
    "tensorboard==2.20.0",
    "ipython==9.15.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = ["ipykernel==7.3.0"]
