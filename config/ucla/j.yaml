work_dir: ./work_dir/ucla/j

feeder: feeders.feeder_ucla.Feeder
train_feeder_args:
  repeat: 10
  window_size: 64
  random_rot: True
  p_interval: [0.5, 1]

val_feeder_args:
  split: test
  repeat: 1
  window_size: 64
  p_interval: [0.95]

model: model.pctgcn.Model
model_args:
  num_class: 10
  num_point: 20
  num_person: 1
  graph: graph.ucla.Graph
  graph_args:
    labeling_mode: "normalized_spatial_k8"
  route_window: 8
  embedding_channels: 128
  channels_scale: 4
  num_subset: 8
  rel_reduction: 4
  topk: 9

loss: model.loss.pctgcn_loss.CrossEntropyOrthogonalLoss
loss_args:
  label_smoothing: 0.1
  orth_weight: 0.05

weight_decay: 0.0004
base_lr: 0.025
step: [40, 60]
param_group_wd_mult:
  - patterns: [alpha_s]
    wd_mult: 1.0
  - patterns: [alpha]
    wd_mult: 0.0

num_epoch: 70
